  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      /* Mismo azul de la app detrás de la muesca, la barra de estado y la barra de gestos */
      background: #16307A;
    }
    #contenedorIframe {
      position: fixed;
      /* En pantalla completa se deja libre la muesca, la barra de estado y la de gestos
         (en navegador normal o computador estos valores son 0). */
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      background: #16307A;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Pantalla de carga: se ve mientras Apps Script arranca (puede tardar unos segundos) */
    #cargando {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 18px;
      background: #16307A;
      color: #fff;
      font: 600 17px/1.4 system-ui, sans-serif;
      z-index: 5;
      transition: opacity .35s;
    }
    #cargando img {
      width: 120px;
      height: 120px;
      animation: girar 1.4s cubic-bezier(.5,.1,.5,.9) infinite;
    }
    #cargando.listo { opacity: 0; pointer-events: none; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #cargando img { animation: none; } }

    /* Botón de pantalla completa: abajo a la izquierda, sobre la barra de gestos */
    #btnPantallaCompleta {
      position: fixed;
      left: calc(14px + env(safe-area-inset-left, 0px));
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      background: rgba(22, 48, 122, .9); /* azul del bingo */
      color: #fff;
      border: 2px solid #FFC93C;          /* dorado de la bola */
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
      cursor: pointer;
    }
    #btnPantallaCompleta svg { width: 22px; height: 22px; }
    #btnPantallaCompleta:focus-visible { outline: 3px solid #FFC93C; outline-offset: 2px; }
    #btnPantallaCompleta[hidden] { display: none; }
  </style>
</head>
<body>

  <div id="cargando" role="status">
    <img src="logo.png" alt="">
    <span>Preparando la sala de bingo…</span>
  </div>

  <div id="contenedorIframe">
    <iframe id="miIframe" title="Bingo 90 online" allowfullscreen allow="fullscreen; clipboard-write; autoplay"></iframe>
  </div>

  <button id="btnPantallaCompleta" type="button" aria-label="Pantalla completa" title="Pantalla completa" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
  </button>

  <noscript>
    <p style="color:#fff;font:16px system-ui;text-align:center;padding:40px">Activa JavaScript para jugar.</p>
  </noscript>

  <script>
    /* ===== URL de la aplicación web de Apps Script (la que termina en /exec) ===== */
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzfMexgtqZbsw64_iUvuGBnJyDWdhdu9DOLEZlfEeyMzJ6M9X_Vrdcyskb3qky2nleO/exec';

    // Si llegaron por un enlace de invitación (…/?codigo=BXKTR), se le pasa el código al juego
    // para que aparezca escrito en "Entrar a una sala".
    const params = new URLSearchParams(location.search);
    const codigo = (params.get('codigo') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6);
    const iframe = document.getElementById('miIframe');
    iframe.src = URL_APPS_SCRIPT + (codigo ? '?codigo=' + codigo : '');

    // Oculta la pantalla de carga cuando el juego terminó de cargar (o a los 12 s, por si acaso)
    const cargando = document.getElementById('cargando');
    const quitarCarga = () => cargando.classList.add('listo');
    iframe.addEventListener('load', quitarCarga);
    setTimeout(quitarCarga, 12000);

    // ===== Pantalla completa =====
    const btn = document.getElementById('btnPantallaCompleta');
    const raiz = document.documentElement;
    const pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
    const salir = document.exitFullscreen || document.webkitExitFullscreen;
    const enPantallaCompleta = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

    // Abierta desde el acceso directo (ya está en modo app)
    const comoApp = window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches
                 || window.navigator.standalone === true;

    // El botón se muestra solo donde sirve: el navegador permite pantalla completa
    // (el iPhone no lo permite para páginas; el iPad y Android sí) y no se abrió como app.
    function actualizarBoton() {
      btn.hidden = !pedir || comoApp || enPantallaCompleta();
    }

    function alternarPantallaCompleta() {
      if (enPantallaCompleta()) { if (salir) salir.call(document); return; }
      if (!pedir) return;
      const r = pedir.call(raiz, { navigationUI: 'hide' });
      if (r && r.catch) r.catch(err => console.error('No se pudo activar pantalla completa: ' + err.message));
    }

    btn.addEventListener('click', alternarPantallaCompleta);
    document.addEventListener('fullscreenchange', actualizarBoton);
    document.addEventListener('webkitfullscreenchange', actualizarBoton);
    actualizarBoton();
  </script>

</body>
</html>
